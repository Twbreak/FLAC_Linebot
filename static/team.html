<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團隊管理 - Scam Hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 sm:p-5">

    <!-- Loading 畫面 -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="loading-spinner"></div>
            <p class="mt-4 text-gray-600">正在初始化...</p>
        </div>
    </div>

    <!-- 錯誤訊息 -->
    <div id="error-screen" class="hidden fixed inset-0 bg-white z-50 flex items-center justify-center p-4">
        <div class="text-center max-w-md">
            <div class="text-6xl mb-4">⚠️</div>
            <h2 class="text-xl font-bold text-red-600 mb-2">發生錯誤</h2>
            <p id="error-message" class="text-gray-600 mb-4"></p>
            <button onclick="location.reload()" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">
                重新載入
            </button>
        </div>
    </div>

    <!-- 主要內容 -->
    <div id="main-content" class="hidden">
        <div class="bg-white shadow-lg rounded-2xl p-4 sm:p-6 w-full max-w-4xl mx-auto">
            
            <!-- 標題 -->
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-blue-600">🏆 團隊管理</h1>
                <a href="index.html" class="text-sm text-gray-500 hover:text-gray-700">
                    ← 返回儀表板
                </a>
            </div>

            <!-- 使用者資訊 -->
            <div id="user-info" class="flex items-center space-x-4 mb-6 p-3 bg-blue-50 rounded-lg">
                <img id="user-avatar" class="w-12 h-12 rounded-full border-2 border-blue-200" src="" alt="Avatar">
                <div>
                    <p id="user-name" class="font-bold text-gray-800">Loading...</p>
                    <p id="user-status" class="text-sm text-gray-500">檢查團隊狀態中...</p>
                </div>
            </div>

            <!-- 建立團隊區塊 -->
            <div id="create-team-section" class="hidden fade-in">
                <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-xl p-6 mb-6 border border-blue-100">
                    <h2 class="text-xl font-bold text-gray-800 mb-2">🎯 建立你的團隊</h2>
                    <p class="text-gray-600 text-sm mb-4">邀請好友一起通報詐騙，累積團隊積分，爭奪排行榜冠軍！</p>
                    
                    <div class="space-y-4">
                        <div>
                            <label for="team-name-input" class="block text-sm font-medium text-gray-700 mb-2">
                                團隊名稱 <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="team-name-input" 
                                maxlength="30"
                                placeholder="輸入團隊名稱（1-30 字元）"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            >
                            <p class="text-xs text-gray-500 mt-1">
                                <span id="char-count">0</span>/30 字元
                            </p>
                        </div>
                        
                        <button 
                            onclick="createTeam()" 
                            id="create-team-btn"
                            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition shadow-md"
                        >
                            ✨ 建立團隊
                        </button>
                    </div>
                </div>
            </div>

            <!-- 團隊資訊區塊 -->
            <div id="team-info-section" class="hidden fade-in">
                <!-- 團隊基本資訊 -->
                <div class="bg-gradient-to-r from-yellow-50 to-orange-50 rounded-xl p-6 mb-6 border border-yellow-100">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h2 id="team-name" class="text-2xl font-bold text-gray-800">我的團隊</h2>
                            <p class="text-sm text-gray-500">
                                隊長: <span id="team-leader-name" class="font-medium">Loading...</span>
                            </p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-500">團隊積分</p>
                            <p id="team-points" class="text-3xl font-black text-yellow-600">0</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="bg-white rounded-lg p-3 text-center">
                            <p class="text-xs text-gray-500 uppercase font-bold">成員數</p>
                            <p id="member-count" class="text-2xl font-black text-blue-500">0</p>
                        </div>
                        <div class="bg-white rounded-lg p-3 text-center">
                            <p class="text-xs text-gray-500 uppercase font-bold">我的貢獻</p>
                            <p id="my-contribution" class="text-2xl font-black text-green-500">0</p>
                        </div>
                    </div>

                    <!-- 邀請按鈕（僅隊長可見） -->
                    <button 
                        onclick="inviteMembers()" 
                        id="invite-btn"
                        class="hidden w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition shadow-md"
                    >
                        📨 邀請好友加入
                    </button>
                </div>

                <!-- 成員清單 -->
                <div class="bg-white rounded-xl p-6 border border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">👥 團隊成員</h3>
                    
                    <div id="members-loading" class="text-center py-8">
                        <div class="loading-spinner"></div>
                        <p class="text-gray-500 mt-2">載入成員清單中...</p>
                    </div>

                    <div id="members-list" class="hidden space-y-3">
                        <!-- 成員項目將由 JavaScript 動態生成 -->
                    </div>
                </div>
            </div>

            <!-- 加入團隊區塊（從邀請連結進入時顯示） -->
            <div id="join-team-section" class="hidden fade-in">
                <div class="bg-gradient-to-r from-green-50 to-teal-50 rounded-xl p-6 border border-green-100">
                    <h2 class="text-xl font-bold text-gray-800 mb-2">🎉 加入團隊邀請</h2>
                    <p class="text-gray-600 text-sm mb-4">您收到了團隊邀請！</p>
                    
                    <div class="bg-white rounded-lg p-4 mb-4">
                        <p class="text-sm text-gray-500">團隊名稱</p>
                        <p id="join-team-name" class="text-xl font-bold text-gray-800 mb-2">Loading...</p>
                        <p class="text-sm text-gray-500">
                            當前成員: <span id="join-member-count" class="font-medium">0</span> 人
                        </p>
                    </div>
                    
                    <button 
                        onclick="confirmJoinTeam()" 
                        id="join-team-btn"
                        class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition shadow-md"
                    >
                        ✅ 確認加入團隊
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="hidden fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50">
        <p id="toast-message"></p>
    </div>

    <script src="/static/team.js?v=1.9"></script>
</body>
</html>
