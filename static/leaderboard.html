<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Leaderboard - Scam Hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rank-1 { background-color: #FEF3C7; border-left: 4px solid #F59E0B; } /* Gold */
        .rank-2 { background-color: #F3F4F6; border-left: 4px solid #9CA3AF; } /* Silver */
        .rank-3 { background-color: #FFEDD5; border-left: 4px solid #D97706; } /* Bronze */
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-2 sm:p-4">
    <div class="max-w-3xl mx-auto">
        <div class="text-center mt-6 mb-8">
            <h1 class="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight">Global Leaderboard</h1>
            <p class="text-slate-500 text-sm sm:text-base">Who is the ultimate Scam Hero?</p>
        </div>

        <div class="bg-white shadow-xl rounded-2xl sm:rounded-3xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead class="bg-slate-800 text-white">
                        <tr>
                            <th class="px-4 py-4 font-bold uppercase text-xs sm:text-sm">Rank</th>
                            <th class="px-4 py-4 font-bold uppercase text-xs sm:text-sm">User ID</th>
                            <th class="px-2 py-4 font-bold uppercase text-xs sm:text-sm text-center">Scams</th>
                            <th class="px-2 py-4 font-bold uppercase text-xs sm:text-sm text-center">Points</th>
                            <th class="px-4 py-4 font-bold uppercase text-xs sm:text-sm text-center">Coupons</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr>
                            <td colspan="5" class="px-6 py-10 text-center text-slate-400">Loading rankings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-8 text-center">
            <a href="index.html" class="inline-flex items-center text-sm font-semibold text-blue-600 hover:text-blue-800 transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to My Dashboard
            </a>
        </div>
    </div>

    <script>
        async function fetchLeaderboard() {
            try {
                // 這裡模擬 API 回傳，你可以換回原本的 fetch('/api/leaderboard')
                const response = await fetch('/api/leaderboard');
                const data = await response.json();
                
                const container = document.getElementById('leaderboard-body');
                container.innerHTML = '';

                data.forEach((user, index) => {
                    const rank = index + 1;
                    let rankClass = '';
                    if(rank === 1) rankClass = 'rank-1';
                    else if(rank === 2) rankClass = 'rank-2';
                    else if(rank === 3) rankClass = 'rank-3';

                    const row = document.createElement('tr');
                    // 手機版讓邊界更清晰
                    row.className = `border-b border-slate-50 transition-colors hover:bg-slate-50 ${rankClass}`;
                    row.innerHTML = `
                        <td class="px-4 py-4 font-black text-base sm:text-lg">${rank}</td>
                        <td class="px-4 py-4 font-mono text-[10px] sm:text-xs text-slate-500 truncate max-w-[100px] sm:max-w-none">
                            ${user.user_id.substring(0, 10)}...
                        </td>
                        <td class="px-2 py-4 text-center font-bold text-sm sm:text-base">${user.total_scams}</td>
                        <td class="px-2 py-4 text-center text-blue-600 font-black text-sm sm:text-base">${user.total_points}</td>
                        <td class="px-4 py-4 text-center">
                            <span class="inline-block bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold text-[10px] sm:text-xs whitespace-nowrap">
                                ${user.coupons}
                            </span>
                        </td>
                    `;
                    container.appendChild(row);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-red-400">Failed to load rankings.</td></tr>';
            }
        }
        fetchLeaderboard();
    </script>
</body>
</html>
