<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam Hero Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <style>
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .dashboard-action-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }
        .dashboard-action-link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 3rem;
            padding: 0.75rem 1rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .dashboard-action-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
            filter: brightness(0.98);
        }
        .history-card {
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }
        .history-card + .history-card {
            margin-top: 0.9rem;
        }
        .markdown-content p + p,
        .markdown-content ul + p,
        .markdown-content p + ul {
            margin-top: 0.5rem;
        }
        .markdown-content ul {
            list-style: disc;
            padding-left: 1.25rem;
        }
        .markdown-content li + li {
            margin-top: 0.25rem;
        }
        .markdown-content strong {
            font-weight: 700;
            color: #1f2937;
        }
        @media (min-width: 640px) {
            .dashboard-action-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
        .full-display-cell {
            word-break: break-word;
            white-space: normal;
            min-width: 160px;
            vertical-align: top;
        }
        td {
            vertical-align: top !important;
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 sm:p-5">

    <!-- Loading 畫面 -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="loading-spinner"></div>
            <p class="mt-4 text-gray-600">正在初始化 LIFF...</p>
        </div>
    </div>

    <!-- 錯誤訊息 -->
    <div id="error-screen" class="hidden fixed inset-0 bg-white z-50 flex items-center justify-center p-4">
        <div class="text-center max-w-md">
            <div class="text-6xl mb-4">⚠️</div>
            <h2 class="text-xl font-bold text-red-600 mb-2">無法初始化 LIFF</h2>
            <p id="error-message" class="text-gray-600 mb-4"></p>
            <button onclick="location.reload()" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">
                重新載入
            </button>
        </div>
    </div>

    <!-- 主要內容 -->
    <div id="main-content" class="hidden">
        <div class="bg-white shadow-lg rounded-2xl p-4 sm:p-6 w-full max-w-5xl mx-auto">
            <h1 class="text-xl sm:text-2xl font-bold text-blue-600 mb-4 text-center">Scam Hero Dashboard</h1>
            
            <div id="user-info" class="flex flex-col items-center text-center sm:flex-row sm:items-center sm:text-left gap-3 sm:gap-4 mb-6 p-4 bg-blue-50 rounded-xl">
                <img id="user-avatar" class="w-20 h-20 sm:w-16 sm:h-16 rounded-full border-2 border-blue-200 shrink-0" src="" alt="Avatar">
                <div class="min-w-0">
                    <p class="text-gray-500 text-sm">Welcome back,</p>
                    <p id="user-name" class="font-bold text-lg sm:text-xl text-gray-800 break-words">Loading...</p>
                    <p id="display-user-id" class="text-[10px] sm:text-xs text-gray-400 font-mono break-all"></p>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 sm:gap-4 mb-8">
                <div class="text-center p-3 bg-gray-50 rounded-xl">
                    <p class="text-gray-500 text-xs uppercase font-bold">Total Scams</p>
                    <p id="user-score" class="text-2xl sm:text-3xl font-black text-blue-500">0</p>
                </div>
                <div class="text-center p-3 bg-yellow-50 rounded-xl border border-yellow-100">
                    <p class="text-gray-500 text-xs uppercase font-bold">Total Points</p>
                    <p id="total-points" class="text-2xl sm:text-3xl font-black text-yellow-500">0</p>
                </div>
                <div class="text-center p-3 bg-green-50 rounded-xl border border-green-100">
                    <p class="text-gray-500 text-xs uppercase font-bold">Coupons</p>
                    <p id="coupon-count" class="text-2xl sm:text-3xl font-black text-green-500">0</p>
                </div>
            </div>
            
            <div class="dashboard-action-grid mb-6">
                <a href="team.html" class="dashboard-action-link bg-blue-500 text-white">
                    👥 我的團隊
                </a>
                <a href="team-leaderboard.html" class="dashboard-action-link bg-yellow-400 text-white">
                    🏆 團隊排行榜
                </a>
                <a href="leaderboard.html" class="dashboard-action-link bg-green-400 text-white">
                    📊 個人排行榜
                </a>
                <a href="trends.html" class="dashboard-action-link bg-red-400 text-white">
                    🗺️ 趨勢地圖
                </a>
            </div>

            <div class="space-y-4">
                <h2 class="text-xl sm:text-2xl font-bold text-gray-700 border-b pb-2">Detection History Table</h2>
                
                <div id="history-card-list" class="md:hidden"></div>

                <div class="hidden md:block table-container border rounded-xl">
                    <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 font-bold text-gray-600">Timestamp</th>
                                <th class="px-4 py-3 font-bold text-gray-600">Category</th>
                                <th class="px-4 py-3 font-bold text-gray-600">Content</th>
                                <th class="px-4 py-3 font-bold text-gray-600">Score</th>
                                <th class="px-4 py-3 font-bold text-gray-600">Analysis</th>
                                <th class="px-4 py-3 font-bold text-gray-600">Warning</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="bg-white divide-y divide-gray-100">
                            <tr>
                                <td colspan="6" class="px-4 py-10 text-center text-gray-400">
                                    <div class="loading-spinner"></div>
                                    <p class="mt-2">Syncing data from database...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <button onclick="handleLogout()" class="mt-8 w-full py-2 text-sm text-red-400 hover:text-red-600 transition">
                🚪 Log Out Account
            </button>
        </div>
    </div>

    <script>
        // ⚠️ 重要：請將此 LIFF ID 替換為你在 LINE Developers Console 建立的 LIFF ID
        const LIFF_ID = "2009609029-RlBZuNs2";

        async function initializeLiff() {
            try {
                console.log("正在初始化 LIFF...");
                await liff.init({ liffId: LIFF_ID });
                
                console.log("LIFF 初始化成功");
                console.log("登入狀態:", liff.isLoggedIn());
                console.log("在 LINE 內開啟:", liff.isInClient());
                
                if (!liff.isLoggedIn()) {
                    console.log("使用者未登入，導向登入頁面");
                    liff.login();
                } else {
                    console.log("使用者已登入，取得個人資料");
                    await loadUserProfile();
                }
            } catch (error) {
                console.error("LIFF 初始化失敗:", error);
                showError(error);
            }
        }

        async function loadUserProfile() {
            try {
                const profile = await liff.getProfile();
                console.log("使用者資料:", profile);
                
                // 顯示使用者資訊
                document.getElementById('user-avatar').src = profile.pictureUrl || 'https://via.placeholder.com/64';
                document.getElementById('user-name').textContent = profile.displayName;
                document.getElementById('display-user-id').textContent = `ID: ${profile.userId}`;
                
                // 載入歷史記錄
                await fetchHistory(profile.userId);
                
                // 隱藏 loading，顯示主要內容
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                
            } catch (error) {
                console.error("無法取得使用者資料:", error);
                showError(error);
            }
        }

        async function fetchHistory(userId) {
            try {
                console.log(`正在取得使用者 ${userId} 的歷史記錄...`);
                const response = await fetch(`/api/history/${userId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log(`取得 ${data.length} 筆記錄`);
                
                const tableBody = document.getElementById('history-table-body');
                const cardList = document.getElementById('history-card-list');
                tableBody.innerHTML = ''; 
                cardList.innerHTML = '';

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-10 text-center text-gray-400">📭 尚無偵測記錄<br><small class="text-xs">傳送訊息給 Bot 開始使用</small></td></tr>';
                    cardList.innerHTML = '<div class="history-card text-center text-gray-400">📭 尚無偵測記錄<br><small class="text-xs">傳送訊息給 Bot 開始使用</small></div>';
                    return;
                }

                let totalPoints = 0;
                let coupons = 0;

                data.forEach(item => {
                    const score = parseInt(item.risk_score) || 0;
                    const timestamp = formatTimestamp(item.created_at || item.timestamp);
                    const category = item.category || 'Uncategorized';
                    const content = item.input_content || 'Image/File';
                    const warning = item.expert_warning || 'None';
                    totalPoints += score;
                    if (score >= 8) {
                        coupons += 1;
                    }

                    const row = document.createElement('tr');
                    row.className = "hover:bg-blue-50/50 transition-colors";
                    const scoreColor = getScoreColor(score);
                    const scoreBadge = getScoreBadge(score);
                    let analysisText = Array.isArray(item.analysis) ? item.analysis.join('; ') : (item.analysis || 'N/A');

                    row.innerHTML = `
                        <td class="px-4 py-3 whitespace-nowrap text-gray-500 text-[11px]">
                            ${timestamp}
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <span class="px-2 py-0.5 rounded-full text-[10px] bg-white border font-medium">${category}</span>
                        </td>
                        <td class="px-4 py-3 text-gray-700 text-xs leading-relaxed full-display-cell">
                            ${escapeHtml(content)}
                        </td>
                        <td class="px-4 py-3 font-black ${scoreColor} whitespace-nowrap">
                            ${score}/10
                        </td>
                        <td class="px-4 py-3 text-gray-600 text-[11px] leading-relaxed full-display-cell">
                            ${escapeHtml(analysisText)}
                        </td>
                        <td class="px-4 py-3 text-gray-600 text-[11px] leading-relaxed full-display-cell">
                            ${escapeHtml(warning)}
                        </td>
                    `;
                    tableBody.appendChild(row);

                    const card = document.createElement('article');
                    card.className = "history-card";
                    card.innerHTML = `
                        <div class="flex items-start justify-between gap-3 mb-3">
                            <div class="min-w-0">
                                <p class="text-xs font-medium text-gray-400 uppercase tracking-wide">Timestamp</p>
                                <p class="text-sm text-gray-700 leading-snug">${timestamp}</p>
                            </div>
                            <div class="shrink-0 ${scoreBadge}">
                                ${score}/10
                            </div>
                        </div>
                        <div class="mb-3">
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-white border border-gray-200 text-gray-700">${category}</span>
                        </div>
                        <div class="space-y-3">
                            <section>
                                <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Content</p>
                                <p class="text-sm text-gray-700 leading-relaxed break-words">${escapeHtml(content)}</p>
                            </section>
                            <section>
                                <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Analysis</p>
                                <div class="markdown-content text-sm text-gray-600 leading-relaxed break-words">${renderMarkdown(analysisText)}</div>
                            </section>
                            <section>
                                <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Warning</p>
                                <p class="text-sm text-gray-600 leading-relaxed break-words">${escapeHtml(warning)}</p>
                            </section>
                        </div>
                    `;
                    cardList.appendChild(card);
                });

                document.getElementById('user-score').textContent = data.length;
                document.getElementById('total-points').textContent = totalPoints;
                document.getElementById('coupon-count').textContent = coupons;

            } catch (error) {
                console.error("無法取得歷史記錄:", error);
                document.getElementById('history-table-body').innerHTML = 
                    '<tr><td colspan="6" class="px-4 py-10 text-center text-red-400">❌ 連線錯誤<br><small class="text-xs">' + error.message + '</small></td></tr>';
                document.getElementById('history-card-list').innerHTML =
                    '<div class="history-card text-center text-red-400">❌ 連線錯誤<br><small class="text-xs">' + escapeHtml(error.message) + '</small></div>';
            }
        }

        function formatTimestamp(value) {
            return new Date(value).toLocaleString('zh-TW');
        }

        function getScoreColor(score) {
            return score >= 7 ? 'text-red-600' : (score >= 4 ? 'text-orange-500' : 'text-green-600');
        }

        function getScoreBadge(score) {
            if (score >= 7) {
                return 'rounded-full px-3 py-1 text-sm font-black bg-red-50 text-red-600 border border-red-100';
            }
            if (score >= 4) {
                return 'rounded-full px-3 py-1 text-sm font-black bg-orange-50 text-orange-500 border border-orange-100';
            }
            return 'rounded-full px-3 py-1 text-sm font-black bg-green-50 text-green-600 border border-green-100';
        }

        function renderMarkdown(text) {
            const source = String(text || '').trim();
            if (!source) {
                return '<p>N/A</p>';
            }

            if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                const rawHtml = marked.parse(source, {
                    breaks: true,
                    gfm: true
                });
                return DOMPurify.sanitize(rawHtml);
            }

            return escapeHtml(source).replace(/\n/g, '<br>');
        }

        function handleLogout() {
            if (confirm('確定要登出嗎？')) {
                liff.logout();
                location.reload();
            }
        }

        function showError(error) {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('error-screen').classList.remove('hidden');
            
            let errorMsg = "請確認：\n";
            errorMsg += "1. LIFF ID 是否正確\n";
            errorMsg += "2. LIFF Endpoint URL 是否正確\n";
            errorMsg += "3. 是否在 LINE 內開啟或已授權\n\n";
            errorMsg += "錯誤詳情：" + (error.message || error);
            
            document.getElementById('error-message').textContent = errorMsg;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 啟動 LIFF
        initializeLiff();
    </script>
</body>
</html>
